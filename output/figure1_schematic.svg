<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Times New Roman, serif" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e65100"/>
    </marker>
    <marker id="arr-y" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f9a825"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect width="760" height="560" fill="white"/>

  <!-- ============================================ -->
  <!-- CENTRAL LOOP                                  -->
  <!-- ============================================ -->

  <!-- Household demand (top centre) -->
  <rect x="270" y="45" width="210" height="44" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="375" y="64" text-anchor="middle" font-size="12" font-weight="bold">Household demand</text>
  <text x="375" y="79" text-anchor="middle" font-size="9.5" fill="#555">(Stone–Geary, eqs. 6–10)</text>

  <!-- Import demand (right) -->
  <rect x="545" y="145" width="170" height="44" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="630" y="164" text-anchor="middle" font-size="12" font-weight="bold">Import demand</text>
  <text x="630" y="179" text-anchor="middle" font-size="9.5" fill="#555">(eqs. 12–13)</text>

  <!-- World demand pressure (right, lower) -->
  <rect x="545" y="260" width="170" height="44" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="630" y="279" text-anchor="middle" font-size="12" font-weight="bold">World demand P_w</text>
  <text x="630" y="294" text-anchor="middle" font-size="9.5" fill="#555">(eqs. 24–25)</text>

  <!-- Import prices (bottom centre) -->
  <rect x="270" y="370" width="210" height="44" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="375" y="389" text-anchor="middle" font-size="12" font-weight="bold">Domestic import prices</text>
  <text x="375" y="404" text-anchor="middle" font-size="9.5" fill="#555">(eqs. 26–27)</text>

  <!-- Real purchasing power (left) -->
  <rect x="30" y="260" width="180" height="44" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="120" y="279" text-anchor="middle" font-size="12" font-weight="bold">Real purchasing power</text>
  <text x="120" y="294" text-anchor="middle" font-size="9.5" fill="#555">(budget ratio, eq. 41)</text>

  <!-- Loop arrows (clockwise) -->
  <!-- Household demand → Import demand -->
  <line x1="480" y1="67" x2="543" y2="150" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Import demand → World demand -->
  <line x1="630" y1="189" x2="630" y2="257" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- World demand → Import prices -->
  <line x1="545" y1="294" x2="482" y2="375" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Import prices → Real purchasing power -->
  <line x1="270" y1="392" x2="212" y2="300" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Real purchasing power → Household demand -->
  <line x1="130" y1="260" x2="275" y2="85" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Loop label -->
  <text x="390" y="250" text-anchor="middle" font-size="10" fill="#999" font-style="italic">feedback loop</text>


  <!-- ============================================ -->
  <!-- SETTLEMENT CONSTRAINT                         -->
  <!-- ============================================ -->
  <rect x="545" y="370" width="170" height="56" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="630" y="388" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#bf360c">Settlement constraint</text>
  <text x="630" y="403" text-anchor="middle" font-size="10" fill="#795548">M ≤ X + R + B</text>
  <text x="630" y="417" text-anchor="middle" font-size="9.5" fill="#795548">(eqs. 29–33)</text>

  <!-- Import demand → Settlement constraint (orange) -->
  <line x1="670" y1="189" x2="670" y2="367" stroke="#e65100" stroke-width="1.3" marker-end="url(#arr-o)"/>

  <!-- Settlement constraint → Import prices (rationing, dashed) -->
  <path d="M545,392 L490,392 Q482,392 482,385 L482,382" fill="none" stroke="#e65100" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>
  <text x="510" y="420" text-anchor="middle" font-size="9" fill="#bf360c">rationing</text>
  <text x="510" y="432" text-anchor="middle" font-size="9" fill="#bf360c">→ price ↑</text>


  <!-- ============================================ -->
  <!-- AUTOMATION (top left)                         -->
  <!-- ============================================ -->
  <rect x="30" y="40" width="185" height="56" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="122" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e7d32">Automation a_t</text>
  <text x="122" y="73" text-anchor="middle" font-size="9.5" fill="#555">labour income ↓  (λ)</text>
  <text x="122" y="87" text-anchor="middle" font-size="9.5" fill="#555">capacity ↑   cost ↓   (eqs. 37–40)</text>

  <!-- Automation → Household demand -->
  <line x1="215" y1="67" x2="267" y2="67" stroke="#2e7d32" stroke-width="1.3" marker-end="url(#arr-g)"/>


  <!-- ============================================ -->
  <!-- TRANSFER MODALITY (left)                      -->
  <!-- ============================================ -->
  <rect x="30" y="130" width="185" height="100" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="122" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1565c0">Transfer modality</text>
  <text x="122" y="163" text-anchor="middle" font-size="9.5" fill="#555">(eqs. 15–21)</text>
  <text x="50" y="182" font-size="10" fill="#333">Cash (UBI / targeted)</text>
  <text x="50" y="197" font-size="10" fill="#333">Food voucher</text>
  <text x="50" y="212" font-size="10" fill="#333">In-kind housing (CLT)</text>

  <!-- Transfer → Household demand -->
  <line x1="170" y1="130" x2="310" y2="91" stroke="#1565c0" stroke-width="1.3" marker-end="url(#arr-b)"/>

  <!-- Import content annotation -->
  <rect x="230" y="112" width="205" height="28" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="0.7" stroke-dasharray="3,2"/>
  <text x="332" y="125" text-anchor="middle" font-size="9" fill="#1565c0">import content differs by modality:</text>
  <text x="332" y="136" text-anchor="middle" font-size="9" fill="#1565c0">cash > voucher > CLT</text>


  <!-- ============================================ -->
  <!-- COLA EXTERNALITY (top right)                  -->
  <!-- ============================================ -->
  <rect x="545" y="45" width="170" height="44" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1.0" stroke-dasharray="4,3"/>
  <text x="630" y="63" text-anchor="middle" font-size="10" fill="#f57f17">Cost-of-living adjustment</text>
  <text x="630" y="78" text-anchor="middle" font-size="10" fill="#f57f17">→ world-price externality</text>

  <!-- COLA arrow down to World demand (dashed, yellow) -->
  <path d="M720,89 L720,257" fill="none" stroke="#f9a825" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-y)"/>
  <text x="737" y="175" font-size="9" fill="#f9a825" transform="rotate(90 737 175)">amplifies demand</text>


  <!-- ============================================ -->
  <!-- OUTCOMES (bottom)                             -->
  <!-- ============================================ -->
  <rect x="120" y="480" width="510" height="55" rx="5" fill="#fce4ec" stroke="#c62828" stroke-width="1.2"/>
  <text x="375" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">Outcome measures</text>
  <text x="375" y="516" text-anchor="middle" font-size="9.5" fill="#555">real provisioning  ·  budget ratio  ·  required vs. deliverable transfer  ·  feasibility (eqs. 44–47)</text>
  <text x="375" y="530" text-anchor="middle" font-size="9.5" fill="#555">→ institutional phase diagram (creditworthiness × self-sufficiency)</text>

  <!-- Import prices → Outcomes -->
  <line x1="375" y1="414" x2="375" y2="477" stroke="#c62828" stroke-width="1.3" marker-end="url(#arr-r)"/>

  <!-- Settlement → Outcomes -->
  <line x1="620" y1="426" x2="595" y2="477" stroke="#c62828" stroke-width="1.0" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>

  <!-- Real purchasing power → Outcomes -->
  <line x1="120" y1="304" x2="210" y2="477" stroke="#c62828" stroke-width="1.0" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>

</svg>
