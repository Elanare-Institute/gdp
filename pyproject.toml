[project]
name = "fugitive-provisioning-v7"
version = "0.7.0"
description = "Fugitive/non-fugitive provisioning simulation (v7)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "SALib>=1.4",
    "scikit-learn>=1.7.2",
]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
